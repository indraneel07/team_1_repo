apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-job
  namespace: spark-loads
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "043672736276.dkr.ecr.us-west-1.amazonaws.com/indraneel-spark:v5"
  imagePullPolicy: Always
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never

  mainApplicationFile: "local:///opt/spark/jobs/launcher.py"

  # NO deps block — the launcher downloads the job zip itself (see --job-zip).
  # spec.deps.pyFiles with s3a:// is resolved by the JAR-less operator pod and
  # was the cause of the ClassNotFoundException.

  arguments:
    - "--job-module"
    - "zfi_lfc302.main"
    - "--job-zip"
    - "s3a://indraneel-re-aws/udecf/v1/wrangler_demo.zip"
    - "--input"
    - "s3a://indraneel-re-aws/raw/person_identity/ZFI_LFC302/2026/05/07"
    - "--output"
    - "s3a://indraneel-re-aws/curated/DU_WORKSPACE/ZFI_LFC302"
    - "--dataset"
    - "ZFI_LFC302"

  sparkConf:
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.sql.execution.arrow.pyspark.enabled": "true"
    "spark.hadoop.mapreduce.fileoutputcommitter.marksuccessfuljobs": "false"
    "spark.dynamicAllocation.enabled": "true"
    "spark.dynamicAllocation.shuffleTracking.enabled": "true"
    "spark.dynamicAllocation.minExecutors": "1"
    "spark.dynamicAllocation.maxExecutors": "4"

  driver:
    cores: 1
    memory: "2g"
    serviceAccount: spark-driver-sa
    labels:
      app: spark-job

  executor:
    cores: 1
    instances: 2
    memory: "2g"
    serviceAccount: spark-driver-sa
    labels:
      app: spark-job
